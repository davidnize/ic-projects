<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <title>dBank</title>
    <base href="/" />
    <link rel="icon" href="favicon.ico" />
    <link type="text/css" rel="stylesheet" href="main.css" />
  </head>
  <body>
    <main>
      <img src="logo.png" alt="DFINITY logo" />
      <form action="#">
        <h1>dBank</h1>
        <h2>Current Balance</h2>
        <section id="value">0</section>

        <label for="input-amount">Top Up Amount: &nbsp;</label>
        <input id="input-amount" name="input-amount" alt="Top Up Amount" type="number" min="0" step="1" />

        <label for="withdrawal-amount">Withdrawal Amount: &nbsp;</label>
        <input id="withdrawal-amount" name="withdrawal-amount" alt="Withdrawal Amount" type="number" min="0" step="1" />

        <button id="submit-btn" type="submit">Update Balance</button>
      </form>
    </main>
  </body>
</html>
